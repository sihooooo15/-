<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>홍길동 | 자기소개</title>

  <!-- Pretendard 폰트 (Google Fonts에는 없으므로 jsDelivr CDN으로 로드) -->
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css"
  />

  <style>
    /* ===== 디자인 토큰 ===== */
    :root {
      --bg-from: #f8fafc;      /* 배경 그라데이션 시작색 */
      --bg-to: #e0f2fe;        /* 배경 그라데이션 끝색 */
      --accent: #0ea5e9;       /* 강조색 (스카이블루) */
      --accent-soft: #e0f2fe;  /* 강조색 연한 버전 */
      --text: #1e293b;         /* 본문 글자색 */
      --text-muted: #64748b;   /* 보조 글자색 */
      --card-bg: rgba(255, 255, 255, 0.65);    /* 카드 반투명 배경 */
      --card-border: rgba(255, 255, 255, 0.8); /* 카드 흐린 테두리 */
      --radius-card: 24px;
      --ease: cubic-bezier(0.22, 1, 0.36, 1);  /* 부드러운 이징 */
    }

    /* ===== 기본 초기화 ===== */
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      height: 100%;
    }

    body {
      font-family: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont,
        system-ui, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
      color: var(--text);
      background: linear-gradient(160deg, var(--bg-from) 0%, var(--bg-to) 100%);
      background-attachment: fixed;
      -webkit-font-smoothing: antialiased;
      /* 화면 정중앙에 카드 배치 */
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px 16px;
      overflow-x: hidden;
    }

    /* 글라스모피즘 효과가 잘 보이도록 배경에 은은한 빛 번짐 추가 */
    body::before,
    body::after {
      content: "";
      position: fixed;
      border-radius: 50%;
      filter: blur(80px);
      z-index: -1;
      pointer-events: none;
    }

    body::before {
      width: 360px;
      height: 360px;
      top: 10%;
      left: 15%;
      background: rgba(14, 165, 233, 0.18);
    }

    body::after {
      width: 300px;
      height: 300px;
      bottom: 10%;
      right: 15%;
      background: rgba(56, 189, 248, 0.16);
    }

    /* ===== 카드 ===== */
    .card {
      width: 100%;
      max-width: 400px;
      padding: 48px 36px 40px;
      text-align: center;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: var(--radius-card);
      backdrop-filter: blur(20px) saturate(160%);
      -webkit-backdrop-filter: blur(20px) saturate(160%);
      box-shadow:
        0 1px 2px rgba(15, 23, 42, 0.04),
        0 12px 40px -12px rgba(15, 23, 42, 0.12);
      transition:
        transform 0.4s var(--ease),
        box-shadow 0.4s var(--ease);
      /* 내부 요소 세로 가운데 정렬 */
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* 마우스를 올리면 살짝 떠오르는 효과 */
    .card:hover {
      transform: translateY(-6px);
      box-shadow:
        0 1px 2px rgba(15, 23, 42, 0.04),
        0 24px 56px -16px rgba(14, 165, 233, 0.28);
    }

    /* ===== 이니셜 아바타 ===== */
    .avatar {
      width: 96px;
      height: 96px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      font-size: 36px;
      font-weight: 700;
      color: #fff;
      background: linear-gradient(135deg, #38bdf8 0%, var(--accent) 100%);
      box-shadow:
        0 0 0 4px rgba(255, 255, 255, 0.9),
        0 8px 24px -6px rgba(14, 165, 233, 0.5);
      margin-bottom: 24px;
      user-select: none;
    }

    /* ===== 이름 ===== */
    .name {
      font-size: 28px;
      font-weight: 700;
      letter-spacing: -0.02em;
      line-height: 1.3;
      margin-bottom: 8px;
    }

    /* ===== 한 줄 소개 ===== */
    .bio {
      font-size: 15px;
      line-height: 1.6;
      color: var(--text-muted);
      margin-bottom: 28px;
      word-break: keep-all;
    }

    /* ===== 관심 태그 (알약 모양 칩) ===== */
    .tags {
      list-style: none; /* 리스트 마커 제거 */
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
      margin-bottom: 32px;
    }

    .tags li {
      list-style: none; /* 브라우저별 마커 노출 방지를 위해 한 번 더 지정 */
    }

    .tags li::marker {
      content: ""; /* 마커 의사요소 완전 제거 */
    }

    .tag {
      display: inline-block;
      padding: 6px 14px;
      font-size: 13px;
      font-weight: 500;
      color: var(--accent);
      background: var(--accent-soft);
      border: 1px solid rgba(14, 165, 233, 0.2);
      border-radius: 999px;
      cursor: default;
      transition:
        background-color 0.25s var(--ease),
        color 0.25s var(--ease),
        border-color 0.25s var(--ease);
    }

    /* 호버 시 배경은 강조색, 글자는 흰색 */
    .tag:hover {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }

    /* ===== 구분선 ===== */
    .divider {
      width: 100%;
      height: 1px;
      background: linear-gradient(
        90deg,
        transparent,
        rgba(100, 116, 139, 0.2),
        transparent
      );
      margin-bottom: 24px;
      border: 0;
    }

    /* ===== 소셜 링크 버튼 ===== */
    .socials {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 12px;
      width: 100%;
    }

    .social-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 10px 18px;
      font-size: 14px;
      font-weight: 600;
      color: var(--text);
      text-decoration: none;
      background: rgba(255, 255, 255, 0.85);
      border: 1px solid rgba(15, 23, 42, 0.08);
      border-radius: 12px;
      transition:
        transform 0.25s var(--ease),
        border-color 0.25s var(--ease),
        color 0.25s var(--ease),
        box-shadow 0.25s var(--ease);
    }

    .social-btn svg {
      width: 18px;
      height: 18px;
      flex-shrink: 0;
      fill: currentColor;
    }

    .social-btn:hover {
      color: var(--accent);
      border-color: rgba(14, 165, 233, 0.4);
      transform: translateY(-2px);
      box-shadow: 0 6px 16px -6px rgba(14, 165, 233, 0.35);
    }

    /* 키보드 접근성: 포커스 표시 */
    .social-btn:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    /* ===== 모바일 반응형 (480px 이하) ===== */
    @media (max-width: 480px) {
      .card {
        padding: 40px 24px 32px;
        border-radius: 20px;
      }

      .avatar {
        width: 80px;
        height: 80px;
        font-size: 30px;
        margin-bottom: 20px;
      }

      .name {
        font-size: 24px;
      }

      .bio {
        font-size: 14px;
        margin-bottom: 24px;
      }

      .tags {
        margin-bottom: 28px;
      }

      /* 좁은 화면에서는 소셜 버튼을 세로로 꽉 차게 배치 */
      .socials {
        flex-direction: column;
        gap: 10px;
      }

      .social-btn {
        width: 100%;
      }
    }

    /* 모션 최소화 설정 사용자 배려 */
    @media (prefers-reduced-motion: reduce) {
      .card,
      .tag,
      .social-btn {
        transition: none;
      }

      .card:hover,
      .social-btn:hover {
        transform: none;
      }
    }
  </style>
</head>
<body>
  <main class="card">
    <!-- 이니셜 아바타 -->
    <div class="avatar" aria-hidden="true">홍</div>

    <!-- 이름 -->
    <h1 class="name">홍길동</h1>

    <!-- 한 줄 소개 -->
    <p class="bio">코드와 커피, 책과 산책을 좋아합니다.</p>

    <!-- 관심 태그 -->
    <ul class="tags" aria-label="관심 태그">
      <li><span class="tag">독서</span></li>
      <li><span class="tag">여행</span></li>
      <li><span class="tag">사진</span></li>
      <li><span class="tag">커피</span></li>
    </ul>

    <hr class="divider" />

    <!-- 소셜 링크 -->
    <nav class="socials" aria-label="소셜 링크">
      <a
        class="social-btn"
        href="https://github.com/claudecode-gilbut"
        target="_blank"
        rel="noopener noreferrer"
      >
        <!-- GitHub 아이콘 -->
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 .5C5.65.5.5 5.65.5 12c0 5.08 3.29 9.39 7.86 10.91.58.11.79-.25.79-.56v-1.96c-3.2.7-3.87-1.54-3.87-1.54-.52-1.33-1.28-1.69-1.28-1.69-1.05-.72.08-.7.08-.7 1.16.08 1.77 1.19 1.77 1.19 1.03 1.77 2.7 1.26 3.36.96.1-.75.4-1.26.73-1.55-2.55-.29-5.24-1.28-5.24-5.69 0-1.26.45-2.29 1.19-3.1-.12-.29-.52-1.46.11-3.05 0 0 .97-.31 3.17 1.18a11 11 0 0 1 5.77 0c2.2-1.49 3.17-1.18 3.17-1.18.63 1.59.23 2.76.11 3.05.74.81 1.19 1.84 1.19 3.1 0 4.42-2.69 5.39-5.26 5.68.41.36.78 1.06.78 2.14v3.17c0 .31.21.68.8.56A11.5 11.5 0 0 0 23.5 12C23.5 5.65 18.35.5 12 .5Z" />
        </svg>
        <span>GitHub</span>
      </a>

      <a
        class="social-btn"
        href="https://linkedin.com/in/claudecode-gilbut"
        target="_blank"
        rel="noopener noreferrer"
      >
        <!-- LinkedIn 아이콘 -->
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M20.45 20.45h-3.56v-5.57c0-1.33-.02-3.04-1.85-3.04-1.86 0-2.14 1.45-2.14 2.94v5.67H9.35V9h3.41v1.56h.05c.48-.9 1.64-1.85 3.37-1.85 3.6 0 4.27 2.37 4.27 5.46v6.28ZM5.34 7.43a2.06 2.06 0 1 1 0-4.13 2.06 2.06 0 0 1 0 4.13ZM7.12 20.45H3.56V9h3.56v11.45ZM22.22 0H1.77C.79 0 0 .77 0 1.73v20.54C0 23.23.79 24 1.77 24h20.45c.98 0 1.78-.77 1.78-1.73V1.73C24 .77 23.2 0 22.22 0Z" />
        </svg>
        <span>LinkedIn</span>
      </a>
    </nav>
  </main>
</body>
</html>
